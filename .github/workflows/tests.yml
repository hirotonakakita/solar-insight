name: Tests
on: [push, pull_request]
jobs:
  detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[solar]'
      - run: python -m unittest discover -s tests
